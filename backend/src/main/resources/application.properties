server.port=8080
spring.application.name=parasoins-backend

# ============================================================================
# CONFIGURATION BASE DE DONNÉES (PostgreSQL / MySQL / H2)
# Par défaut, utilise PostgreSQL si le profil 'pg' est actif, MySQL si 'mysql',
# ou une base persistante locale H2 compatible PostgreSQL pour démarrage immédiat.
# ============================================================================
spring.datasource.url=jdbc:h2:file:./data/parasoins_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Pour activer PostgreSQL (décommenter ces lignes) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/para_db
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres

# --- Pour activer MySQL / XAMPP (décommenter ces lignes) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/para_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuration JWT (NF1)
parasoins.jwt.secret=ParaSoinsSecretKeyForJwtAuthentication2026SpringSecurityTokenKey256Bits
parasoins.jwt.expiration=86400000

# Upload images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
